<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub</title>
    <style>
        :root {
            --primary: #00ff88;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --error: #ff4757;
            --warning: #ffa502;
            --back-btn: #3498db;
        }

        /* Full Screen Loading Overlay */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #333;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        body { 
            font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); 
            padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center;
        }

        /* Hide content until script decides what to show */
        #host-section, #main-content { display: none; }

        h1 { color: var(--primary); text-transform: uppercase; margin-bottom: 20px; }
        
        #host-section {
            background: #1a1a1a; border-radius: 8px; max-width: 750px; 
            margin-bottom: 30px; padding: 25px; border: 1px solid #333; text-align: center;
        }
        .host-grid { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; justify-content: center; }
        
        .btn {
            padding: 10px 18px; color: #000; font-weight: bold;
            text-decoration: none; border-radius: 6px; font-size: 0.85rem;
            background: #ccc; cursor: pointer; border: none; transition: 0.3s;
        }
        
        .recommended { background: var(--primary) !important; outline: 3px solid var(--primary); outline-offset: 3px; }
        .blocked { background: var(--error) !important; color: white !important; cursor: not-allowed; }
        .github-note { color: var(--warning); font-size: 0.85rem; margin-top: 10px; font-style: italic; }

        #main-content { width: 100%; max-width: 1100px; flex-direction: column; align-items: center; }
        #controls { display: flex; gap: 10px; width: 100%; max-width: 600px; margin-bottom: 30px; }
        #search-bar {
            flex-grow: 1; padding: 12px 20px; border-radius: 25px;
            border: 2px solid #333; background: #1e1e1e; color: white;
            font-size: 1rem; outline: none;
        }
        #random-btn { 
            background: var(--primary); color: black; border: none; 
            padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer;
        }

        #game-list { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; width: 100%;
        }
        .game-card { 
            background: var(--card-bg); border-radius: 12px; padding: 20px; 
            text-align: center; transition: 0.2s; border: 1px solid #333;
            text-decoration: none; color: inherit;
        }
        .game-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        
        /* Special styling for the Back card */
        .game-card.back-card { border-color: var(--back-btn); }
        .game-card.back-card:hover { border-color: #5dade2; background: #252525; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 20px; letter-spacing: 1px;">INITIALIZING SYSTEM...</p>
    </div>

    <h1>🕹️ Arcade Hub</h1>

    <div id="host-section">
        <h2 style="margin-top:0">⚠️ Hosting Setup Required</h2>
        <p>Local folders are currently blocked by your browser. Upload to a host to enable the library:</p>
        <div class="host-grid">
            <a href="https://app.netlify.com/drop/" id="link-netlify" target="_blank" class="btn recommended">Netlify Drop</a>
            <a href="https://tiiny.host/" id="link-tiiny" target="_blank" class="btn">Tiiny.host</a>
            <a href="https://github.com" id="link-github" target="_blank" class="btn">GitHub</a>
            <a href="https://vercel.com/" id="link-vercel" target="_blank" class="btn">Vercel</a>
            <a href="https://pages.cloudflare.com/" id="link-cloudflare" target="_blank" class="btn">Cloudflare</a>
            <a href="https://www.google.com/search?q=free+static+html+hosting+alternatives" target="_blank" class="btn" style="background: #4285F4; color: white;">🔍 Search Alternatives</a>
        </div>
        <p class="github-note">Note: GitHub.com may work, but GitHub.io is often restricted.</p>
    </div>

    <div id="main-content">
        <div id="controls">
            <input type="text" id="search-bar" placeholder="Search library..." onkeyup="filterGames()">
            <button id="random-btn" onclick="playRandom()">Shuffle 🎲</button>
        </div>
        <div id="game-list"></div>
    </div>

    <script>
        let allGames = [];
        const hosts = [
            { id: 'link-netlify', url: 'https://app.netlify.com/drop/' },
            { id: 'link-tiiny', url: 'https://tiiny.host/' },
            { id: 'link-github', url: 'https://github.com' },
            { id: 'link-vercel', url: 'https://vercel.com' },
            { id: 'link-cloudflare', url: 'https://pages.cloudflare.com' }
        ];

        async function checkSiteStatus() {
            const statusPromises = hosts.map(async (host) => {
                const el = document.getElementById(host.id);
                try {
                    await fetch(host.url, { mode: 'no-cors' });
                } catch (e) {
                    el.classList.add('blocked');
                    el.innerText += " (Blocked)";
                    el.onclick = (event) => {
                        event.preventDefault();
                        alert("Access to this platform is blocked by your network.");
                    };
                }
            });
            await Promise.all(statusPromises);
        }

        async function init() {
            const hostCheck = checkSiteStatus();

            if (window.location.protocol === 'file:') {
                document.getElementById('host-section').style.display = 'block';
            } else {
                try {
                    const response = await fetch('games.json');
                    if (!response.ok) throw new Error();
                    allGames = await response.json();
                    renderGames(allGames);
                    document.getElementById('main-content').style.display = 'flex';
                } catch (err) {
                    document.getElementById('host-section').style.display = 'block';
                }
            }

            await hostCheck;
            
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        }

        function renderGames(games) {
            const container = document.getElementById('game-list');
            container.innerHTML = '';
            games.forEach(folder => {
                const card = document.createElement('a');
                card.className = 'game-card';
                
                if (folder.toLowerCase() === 'back') {
                    // FIXED: Path now points to the parent directory to return to the hub
                    card.href = '../index.html'; 
                    card.classList.add('back-card');
                    card.setAttribute('data-name', 'back');
                    card.innerHTML = `<div class="icon">⬅️</div><div class="title">Return to Hub</div>`;
                } else {
                    // Standard game folder logic
                    const cleanName = folder.split(/[-_]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                    card.href = `${folder}/index.html`;
                    card.setAttribute('data-name', cleanName.toLowerCase());
                    card.innerHTML = `<div class="icon">🎮</div><div class="title">${cleanName}</div>`;
                }
                
                container.appendChild(card);
            });
        }

        function filterGames() {
            const query = document.getElementById('search-bar').value.toLowerCase();
            document.querySelectorAll('.game-card').forEach(card => {
                card.style.display = card.getAttribute('data-name').includes(query) ? 'block' : 'none';
            });
        }

        function playRandom() {
            // Filter out 'back' so shuffle doesn't just reload the page or break paths
            const playableGames = allGames.filter(g => g.toLowerCase() !== 'back');
            if (playableGames.length > 0) {
                const randomFolder = playableGames[Math.floor(Math.random() * playableGames.length)];
                window.location.href = `${randomFolder}/index.html`;
            }
        }

        init();
    </script>
</body>
</html>
